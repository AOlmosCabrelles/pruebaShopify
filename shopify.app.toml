# Configuración de Vigor Manager.
# `client_id` lo rellena la Shopify CLI la primera vez que ejecutas `shopify app dev`
# (o `shopify app config link`). No es secreto: se puede subir a GitHub.
client_id = ""
name = "Vigor Manager"

[access_scopes]
# write_products   → catálogo de prueba y metafields nutricionales
# write_inventory  → stock inicial de cada variante
# read_locations   → ubicación donde se guarda el stock
# write_publications → publicar productos en la tienda online
# write_discounts  → crear el descuento automático del pack
scopes = "write_products,write_inventory,read_locations,write_publications,write_discounts"

[webhooks]
api_version = "2026-10"

  # Gestionado en: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Gestionado en: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Webhooks obligatorios de privacidad (RGPD) para apps públicas
  # https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
