name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Prisma (generar cliente y validar esquema)
        run: npx prisma generate && npx prisma validate

      - name: Migraciones aplicables desde cero
        run: npx prisma migrate deploy

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (Shopify Function del pack)
        run: npm test

      - name: Build
        run: npm run build
