version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      shopify:
        patterns: ["@shopify/*"]
      react-router:
        patterns: ["react-router", "@react-router/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
