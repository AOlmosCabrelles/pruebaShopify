name: Nueva funcionalidad
description: Propón una funcionalidad para Vigor Manager
labels: ["funcionalidad"]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
      placeholder: "Como gestor de la tienda quiero... para..."
    validations:
      required: true
  - type: dropdown
    id: zona
    attributes:
      label: ¿Dónde se ve?
      options:
        - Admin (app embebida)
        - Tienda (theme app extension)
        - Checkout (Shopify Function)
        - Backend / webhooks
        - CI/CD
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: "- [ ] ..."
